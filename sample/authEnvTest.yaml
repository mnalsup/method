# Environment Variable Authentication Example
# Uses value resolver to set authentication token in environment variable

method: GET
url: https://httpbin.org/bearer

valueResolvers:
  - name: auth_token
    requestPath: sample/auth.yaml
    jsonParseBodyPath: "slideshow.slides.0.type"
    target:
      environmentVariable:
        name: METHOD_TEST_AUTH_TOKEN

headers:
  Authorization: Bearer ${METHOD_TEST_AUTH_TOKEN}
